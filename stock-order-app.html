<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>นับสต๊อก・在庫カウント</title>
<style>
  :root{
    --paper:#E9EBE6; --card:#FFFFFF; --ink:#15181B; --muted:#5C6259; --line:#D2D7CB;
    --nori:#21252A; --ume:#B32133; --dashi:#A0701A; --take:#2E6B4F;
    --radius:10px; --bar:70px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Thai","Thonburi","Leelawadee UI","Hiragino Kaku Gothic ProN","Noto Sans JP","Segoe UI",sans-serif;
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
    padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom));
  }
  .num{font-variant-numeric:tabular-nums}
  button{font:inherit;color:inherit;cursor:pointer}
  input,select{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--take);outline-offset:2px}

  /* 併記 */
  .th{display:block;line-height:1.3}
  .ja{display:block;color:var(--muted);font-size:.78em;font-weight:400;line-height:1.3}
  .inline .th,.inline .ja{display:inline}
  .inline .ja::before{content:"／"}
  body.lang-th .ja{display:none!important}
  body.lang-ja .th{display:none!important}
  header .ja{color:#9DA398}
  .tabs .ja,.go .ja{color:inherit;opacity:.72}

  header{position:sticky;top:0;z-index:20;background:var(--nori);color:#F2F3EF;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
  .hrow{display:flex;align-items:baseline;gap:10px}
  .hrow h1{margin:0;font-size:16px;font-weight:700}
  .hrow .date{margin-left:auto;font-size:12px;color:#A9AFA6;text-align:right;white-space:nowrap}
  .tabs{display:flex;gap:5px;margin-top:10px}
  .tabs button{flex:1;min-width:0;background:transparent;border:1px solid #444A51;color:#C3C8BE;border-radius:9px;padding:8px 4px;min-height:44px;font-size:12px;text-align:center}
  .tabs button[aria-current="true"]{background:#F2F3EF;color:var(--nori);border-color:#F2F3EF;font-weight:700}

  main{padding:12px 12px 8px;max-width:620px;margin:0 auto}
  .hint{color:var(--muted);font-size:12.5px;margin:0 2px 12px}

  .filter{display:flex;gap:6px;overflow-x:auto;padding:0 2px 10px;margin:0 -2px 4px;scrollbar-width:none}
  .filter::-webkit-scrollbar{display:none}
  .filter button{flex:none;display:inline-flex;align-items:center;min-height:44px;max-width:min(190px,52vw);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 14px;font-size:13.5px;white-space:nowrap}
  .filter .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .filter button[aria-pressed="true"]{background:var(--nori);color:#F2F3EF;border-color:var(--nori);font-weight:700}
  .filter .rest{color:var(--ume);font-size:11px;margin-left:5px}
  .filter button[aria-pressed="true"] .rest{color:#F0A6AE}

  .group{margin-bottom:18px}
  .ghead{display:flex;align-items:center;gap:8px;margin:0 2px 7px;flex-wrap:wrap}
  .ghead h2{margin:0;font-size:14px;font-weight:700}
  .ghead .state{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .state.open{background:#E4EFE8;color:var(--take)}
  .state.shut{background:#FAEFD9;color:#7A5A12}
  .ghead .next{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
  .rows{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}

  .row{display:flex;align-items:center;gap:8px;padding:9px 10px;border-top:1px solid var(--line)}
  .row:first-child{border-top:none}
  .row .info{flex:1;min-width:0}
  .row .nm{font-weight:600;font-size:15px;line-height:1.3}
  .row .nm .ja{font-size:.8em}
  .row .meta{font-size:11.5px;color:var(--muted);margin-top:2px}
  .row .flag{font-size:12px;font-weight:700;margin-top:3px}
  .flag.need{color:var(--ume)} .flag.ok{color:var(--take)} .flag.none{color:var(--dashi)}
  .flag.blank{display:none}
  /* 数える単位（袋・箱…）を入力欄の下に小さく出す。数字が何の個数かを迷わせないため */
  .stepwrap{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px}
  .stepwrap .ulab{font-size:10.5px;color:var(--muted);line-height:1.1;max-width:150px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stepper{display:flex;align-items:center;gap:4px;flex:none}
  .stepper button{width:44px;height:44px;border:1px solid var(--line);background:#F7F8F5;border-radius:8px;font-size:20px;font-weight:600;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
  .stepper button:active{background:#E6E8E2}
  .stepper input{width:64px;height:44px;text-align:center;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;padding:0 2px}
  .stepper input::placeholder{color:var(--muted);font-weight:500;font-size:14px}
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .stepper input[type=number]{-moz-appearance:textfield}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(233,235,230,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px}
  .bar[hidden]{display:none}
  .bar .sum{flex:1;min-width:0;font-size:12px;color:var(--muted);line-height:1.35}
  .bar .sum b{display:block;font-size:14.5px;color:var(--ink);font-variant-numeric:tabular-nums}
  .go{flex:none;background:var(--nori);color:#F2F3EF;border:none;border-radius:9px;padding:10px 16px;font-size:14px;font-weight:700;text-align:center}
  .go:disabled{background:#C9CDC4;color:#3D4239}

  .slip{background:var(--card);border:1px solid var(--line);border-radius:0 0 var(--radius) var(--radius);margin:0 0 18px;position:relative}
  .slip::before{content:"";position:absolute;left:-1px;right:-1px;top:-7px;height:8px;background:radial-gradient(circle at 5px 0, transparent 5px, var(--line) 5px, var(--line) 6px, transparent 6px) repeat-x;background-size:10px 8px}
  .slip.shut{opacity:.82}
  .slip .sup{display:flex;align-items:center;gap:8px;padding:12px 13px 10px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
  .slip .sup h3{margin:0;font-size:16px;font-weight:700}
  .slip .sup .cnt{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
  .slip .closed{width:100%;font-size:12px;color:#7A5A12;background:#FBF3E3;border:1px solid #E6D3A8;border-radius:7px;padding:7px 9px;margin-top:2px}
  .line{display:flex;gap:10px;padding:9px 13px;border-bottom:1px dashed var(--line);align-items:baseline}
  .line .n{flex:1} .line .q{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .line .q .qsub{display:block;font-weight:400;font-size:11px;color:var(--muted)}
  .line .p{width:86px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
  .line .sub{font-size:11px;color:var(--muted);margin-top:1px}
  .slip .foot{display:flex;align-items:center;padding:11px 13px;gap:10px}
  .slip .foot .lbl{font-size:12px;color:var(--muted)}
  .slip .foot .amt{margin-left:auto;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
  .acts{display:flex;gap:8px;padding:0 13px 13px}
  .acts a,.acts button{flex:1;text-align:center;text-decoration:none;border-radius:9px;padding:10px 8px;font-size:13.5px;font-weight:700;border:1px solid var(--nori)}
  .acts a{background:var(--nori);color:#F2F3EF}
  .acts a .ja{color:#B9BEB4}
  .acts a[aria-disabled="true"]{background:#DDE0D9;color:#41473F;border-color:#AEB4A9;pointer-events:none}
  .acts button{background:transparent;color:var(--nori)}
  .acts button.solo{background:var(--nori);color:#F2F3EF}
  .acts button.solo .ja{color:#B9BEB4}
  .secttl{margin:2px 2px 9px;font-size:12px;font-weight:700;color:var(--muted)}
  .total{display:flex;align-items:center;padding:14px 4px 4px;border-top:2px solid var(--ink);margin-top:4px}
  .total .lbl{font-size:13.5px;font-weight:700}
  .total .amt{margin-left:auto;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
  .note{margin:10px 2px 0;font-size:11.5px;color:var(--muted)}
  .warn{background:#FBF3E3;border:1px solid #E6D3A8;color:#7A5A12;border-radius:9px;padding:10px 12px;font-size:12.5px;margin-bottom:14px}
  .empty{text-align:center;color:var(--muted);padding:44px 20px;font-size:14px}
  .sheetbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px;margin:18px 0 8px}
  .sheetbox h4{margin:0 0 4px;font-size:14px}
  .sheetbox p{margin:0 0 10px;font-size:11.5px;color:var(--muted)}
  .sheetbox .cap2{margin:-4px 0 10px;font-size:11px;color:var(--dashi)}
  .sheetbox .warn{margin:0 0 10px}
  .sheetbox .brow + .brow{margin-top:8px}
  .sheetbox .brow{display:flex;gap:8px}
  .sheetbox .brow button{flex:1;border-radius:9px;padding:11px 8px;font-size:13.5px;font-weight:700;border:1px solid var(--take);background:var(--take);color:#fff}
  .sheetbox .brow button.alt{background:transparent;color:var(--take)}
  .sheetbox .brow button:disabled{opacity:.5}

  .mcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
  .mcard summary{padding:11px 13px;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center}
  .mcard summary::-webkit-details-marker{display:none}
  .mcard summary .nmwrap{flex:1;min-width:0}
  .mcard summary .s{font-size:11.5px;color:var(--muted);font-weight:400;text-align:right;white-space:nowrap}
  .fields{padding:2px 13px 13px;border-top:1px dashed var(--line);display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .fields label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
  .fields label.wide{grid-column:1/-1}
  .fields label>.th,.fields label>.ja{display:inline}
  .fields label>.ja::before{content:"／"}
  .fields input,.fields select{border:1px solid var(--line);border-radius:7px;padding:9px;background:#FBFCFA;font-size:15px;width:100%;color:var(--ink)}
  .fields label>.eq{font-size:10.5px;color:var(--dashi);line-height:1.2;min-height:12px}
  .fields > .cap{font-size:11px;color:var(--muted);line-height:1.45;margin:0}
  .days{grid-column:1/-1}
  .days > .cap{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
  .days .dd{display:flex;gap:4px}
  .days .dd button{flex:1;padding:9px 0;border:1px solid var(--line);background:#FBFCFA;border-radius:7px;font-size:13px}
  .days .dd button[aria-pressed="true"]{background:var(--ume);color:#fff;border-color:var(--ume);font-weight:700}
  .hol{grid-column:1/-1}
  .hol > .cap{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
  .add{display:flex;gap:6px;margin-bottom:18px}
  .hol .add{margin-bottom:0}
  .add input{flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;padding:11px 9px;background:#FBFCFA;font-size:15px}
  .add button{flex:none;min-height:44px;padding:9px 18px;border:1px solid var(--line);background:#F7F8F5;border-radius:7px;font-size:14px}
  .holchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .holchips button{display:inline-flex;align-items:center;min-height:40px;border:1px solid var(--line);background:#FBFCFA;border-radius:999px;padding:5px 13px;font-size:12.5px}
  .holchips button::after{content:" ×";color:var(--ume);font-weight:700}
  .del{grid-column:1/-1;justify-self:start;background:none;border:none;color:var(--ume);font-size:12.5px;padding:4px 0;text-decoration:underline}
  .addbtn{width:100%;padding:13px;border:1px dashed var(--line);background:transparent;border-radius:var(--radius);color:var(--muted);font-weight:600;margin-bottom:22px}
  .setrow{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;margin-bottom:18px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .setrow label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
  .setrow label.wide{grid-column:1/-1}
  .setrow label>.th,.setrow label>.ja{display:inline}
  .setrow label>.ja::before{content:"／"}
  .setrow input,.setrow select{border:1px solid var(--line);border-radius:7px;padding:9px;background:#FBFCFA;font-size:15px;width:100%;color:var(--ink)}
  .setrow .cap{grid-column:1/-1;font-size:11px;color:var(--muted);margin:-2px 0 0}
  .setrow .verrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
  .setrow .verrow button{flex:none;min-height:36px;border:1px solid var(--line);background:#F7F8F5;border-radius:7px;padding:7px 13px;font-size:12.5px}
  .danger{display:inline-block;margin:0;background:none;border:none;color:var(--ume);font-size:12.5px;text-decoration:underline;padding:11px 0}
  .lockbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px 16px;margin-top:28px;text-align:center}
  .lockbox .lockttl{margin:0 0 4px;font-size:14.5px;font-weight:700;color:var(--ink)}
  .lockbox .lockcap{margin:0 0 16px;font-size:11.5px;color:var(--muted)}
  .lockbox input{width:180px;max-width:100%;text-align:center;letter-spacing:.36em;font-size:22px;font-weight:700;padding:11px 9px;border:1px solid var(--line);border-radius:8px;background:#FBFCFA;color:var(--ink);margin-bottom:16px}
  .lockbox .addbtn{margin-bottom:2px;border-style:solid;background:#F7F8F5;color:var(--ink)}

  .updbar{background:var(--dashi);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 9px) 12px 9px;font-size:13px;font-weight:600}
  .updbar[hidden]{display:none}
  .holbar{background:#FBF3E2;color:#6B5426;border-bottom:1px solid #EFE2C4;padding:9px 13px;font-size:12.5px;font-weight:600;line-height:1.45}
  .holbar[hidden]{display:none}
  .howto .hbody{padding:0 13px 12px;font-size:12.5px;line-height:1.5}
  .howto .hbody>p{margin:0 0 10px}
  .howto .hbody .f{background:#F2F3EF;border-radius:8px;padding:9px 10px;font-weight:600}
  .howto .hbody .ex{background:#FBFCFA;border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin:0 0 10px}
  .howto .hbody .ex p{margin:0 0 5px}
  .howto .hbody .ex p:last-child{margin:0}
  .howto .hbody .sub{color:var(--muted)}
  .updbar .t{flex:1;min-width:0}
  body:has(.updbar:not([hidden])) header{padding-top:10px}
  .updbar button{flex:none;min-height:36px;border:1px solid #fff;background:#fff;color:var(--dashi);border-radius:8px;padding:6px 14px;font-size:13px;font-weight:700}
  .updbar button.x{background:transparent;color:#fff;border-color:rgba(255,255,255,.6);padding:6px 11px}
  .toast{position:fixed;left:50%;bottom:calc(var(--bar) + 18px);transform:translateX(-50%);background:var(--nori);color:#F2F3EF;padding:10px 16px;border-radius:999px;font-size:13px;z-index:50;opacity:0;pointer-events:none;transition:opacity .18s;max-width:88%;text-align:center}
  .toast.on{opacity:1}

  /* 納品入力 */
  .rbtns{display:flex;gap:8px;margin:0 0 14px}
  .rbtns button{flex:1;border:1px solid var(--take);background:transparent;color:var(--take);border-radius:9px;padding:11px 8px;font-size:13px;font-weight:700}
  .rbtns button.alt{border-color:var(--line);color:var(--muted)}
  .flag.short{color:var(--ume)} .flag.exact{color:var(--take)} .flag.over{color:var(--dashi)}
  .emptysub{display:block;font-size:12px;margin-top:8px}

  /* 自動提案 */
  .sug{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
  .sugrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
  .sugrow:first-child{border-top:none}
  .sugrow input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--take);margin:0}
  .sugrow .n{flex:1;min-width:0;font-size:13px}
  .sugrow .n .d{display:block;font-size:11px;color:var(--muted);margin-top:2px}
  .sugrow .v{flex:none;text-align:right;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.6}
  .sugrow .v b{font-size:13.5px;color:var(--ink)}
  .sugrow .v .old{text-decoration:line-through;margin:0 4px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="updbar" id="updbar" hidden></div>

<header>
  <div class="hrow">
    <h1 id="storeTitle">นับสต๊อก</h1>
    <span class="date num" id="today"></span>
  </div>
  <nav class="tabs">
    <button data-nav="count" aria-current="true"><span class="th">นับสต๊อก</span><span class="ja">在庫</span></button>
    <button data-nav="recv"><span class="th">รับของ</span><span class="ja">納品</span></button>
    <button data-nav="result"><span class="th">สั่งซื้อ</span><span class="ja">発注</span></button>
    <button data-nav="master"><span class="th">ตั้งค่า</span><span class="ja">設定</span></button>
  </nav>
</header>

<div class="holbar" id="holbar" hidden></div>
<main id="app"></main>
<div class="bar" id="bar" hidden></div>
<div class="toast" id="toast"></div>

<script>
const KEY = 'stock-order-app-v3';
/* データの形の版。
   1 … 基準在庫・在庫を実量（g など）で持っていた
   2 … 基準在庫・在庫・前回在庫・納品実数をロット数（袋・箱…）で持つ */
const DATA_VER = 2;
const WD_TH = ['อา','จ','อ','พ','พฤ','ศ','ส'];
const WD_JA = ['日','月','火','水','木','金','土'];
/* ロットの呼び名。品目には key を保存し、表示だけ言語に合わせる。
   未設定のときは「ล็อต / ロット」と出す（誤った呼び名を入れないための既定）。 */
const LOT_UNITS = [
  {k:'bag',    th:'ถุง',      ja:'袋'},
  {k:'box',    th:'กล่อง',    ja:'箱'},
  {k:'pack',   th:'แพ็ค',     ja:'パック'},
  {k:'case',   th:'ลัง',      ja:'ケース'},
  {k:'bottle', th:'ขวด',      ja:'本'},
  {k:'can',    th:'กระป๋อง',  ja:'缶'},
  {k:'piece',  th:'ชิ้น',      ja:'個'},
  {k:'tray',   th:'ถาด',      ja:'トレー'},
  {k:'sheet',  th:'แผ่น',     ja:'枚'},
  {k:'kg',     th:'กก.',      ja:'kg'}
];
const DEFAULT_UNITS = ['g','kg','個','パック','袋','本','枚','缶','箱','ℓ','ml'];

/* ---------- 保存領域 ----------
   プレビュー環境では window.storage が用意されるが、GitHub Pages など通常のブラウザには存在しない。
   未定義のままだと save()/load() が黙って失敗し、設定も在庫入力も残らない。
   そのため window.storage が無い環境では localStorage を同じインターフェースで代用する。 */
if(!window.storage){
  window.storage = {
    async get(k){ try{ const v = localStorage.getItem(k); return v === null ? null : {value:v}; }catch(e){ return null; } },
    async set(k, v){ try{ localStorage.setItem(k, v); return true; }catch(e){ return false; } },
    async remove(k){ try{ localStorage.removeItem(k); }catch(e){} }
  };
}

/* ---------- 文言 ---------- */
const L = {
  hintCount:['นับของบนชั้นเป็นล็อต (ถุง・กล่อง…) แล้วกรอกจำนวน ช่องที่เว้นว่างจะไม่ถูกสั่งซื้อ','棚を数えて入力してください（袋・箱などロット単位）。空欄の品目は発注に含みません'],
  noItems:['ยังไม่มีรายการ เพิ่มได้ที่หน้าตั้งค่า','品目がありません。設定で登録してください'],
  all:['ทั้งหมด','すべて'],

const toLots = (v, n) => (v === null || v === undefined || v === '') ? v : round2(Number(v) / n);
function migrateToLots(){
  for(const it of state.items){
    const n = lotSize(it);
    if(n === 1) continue;
    it.par = round2(Number(it.par || 0) / n);
    const c = state.counts[it.id];
    if(c !== undefined && c !== '' && c !== null) state.counts[it.id] = String(toLots(c, n));
    const p = state.prev[it.id];
    if(p){
      p.stock = toLots(p.stock, n);
      p.order = toLots(p.order, n);
      p.received = toLots(p.received, n);
    }
  }
}
async function load(){
  let oldVer = DATA_VER;

    if(r && r.value){

      if(d && Array.isArray(d.items)){ oldVer = Number(d.ver) || 1; state = Object.assign(state, d); }
    }
  }catch(e){}
  if(!Array.isArray(state.suppliers)) state.suppliers = [];
  state.suppliers.forEach(s => { if(!Array.isArray(s.closed)) s.closed = []; if(!Array.isArray(s.holidays)) s.holidays = []; });
  if(!state.prev) state.prev = {};
  if(!Array.isArray(state.units) || !state.units.length) state.units = [...DEFAULT_UNITS];
  if(!Array.isArray(state.history)) state.history = [];

  if(!(Number(state.cycle) > 0)) state.cycle = 3;

  if(!(state.pin && state.pin.h && state.pin.s)) state.pin = null;
  if(!Array.isArray(state.hol)) state.hol = [];
  if(oldVer < 2){ migrateToLots(); state.ver = DATA_VER; save(); }
  state.ver = DATA_VER;
  state.suppliers = state.suppliers.map(normSup);
  state.items = (Array.isArray(state.items) ? state.items : []).map(normItem);
  /* 前回「発注を記録する」で終わっていたら、在庫の入力は空から始める */
  if(state.clearNext){

  if(!state.masterSig) state.masterSig = masterSig();
}

/* ---------- 設定画面のロック（暗証番号） ----------
   基準在庫・単価・仕入先情報を店舗スタッフが変更できないようにするための簡易ロック。
   暗証番号そのものは保存せず、ソルトを付けて繰り返しハッシュした文字列だけを端末に保存する。
   解除状態はメモリにしか持たないので、画面を離れる・アプリを閉じると再びロックがかかる。 */
let unlocked = false;
/* 試行回数と待ち時間は端末に持つ。再読込でリセットされると繰り返し試し放題になるため */
const pinFailGet = () => Number(state.pinFail) || 0;
const pinFailSet = n => { state.pinFail = n; save(); };
const pinWaitGet = () => Number(state.pinWait) || 0;
const pinWaitSet = t => { state.pinWait = t; save(); };
const lockOn = () => !!(state.pin && state.pin.h);
function pinHash(pin, salt){
  const s = salt + '|' + String(pin) + '|' + salt;
  let h1 = 0x811c9dc5, h2 = 0x9e3779b9;
  for(let r = 0; r < 997; r++){
    for(let i = 0; i < s.length; i++){
      const c = s.charCodeAt(i);
      h1 = Math.imul((h1 ^ c) >>> 0, 16777619) >>> 0;
      h2 = Math.imul((h2 + c * (i + 1)) ^ h1, 2654435761) >>> 0;
    }
  }
  return h1.toString(36) + '-' + h2.toString(36);
}
const makePin = pin => { const s = Math.random().toString(36).slice(2, 10); return { s, h: pinHash(pin, s) }; };
const pinCheck = pin => lockOn() && pinHash(String(pin == null ? '' : pin), state.pin.s) === state.pin.h;
function renderLock(){
  bar.hidden = true;
  app.innerHTML = `<div class="lockbox">
    <p class="lockttl">${pick('lockTitle')}</p>
    <p class="lockcap">${pick('lockHint')}</p>
    <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" id="pinIn">
    <button class="addbtn" id="pinGo">${one('lockOpen')}</button>
    <button class="danger" id="pinCancel">${one('lockCancel')}</button>
  </div>`;
  const inp = document.getElementById('pinIn');
  const submit = () => {
    const left = Math.ceil((pinWaitGet() - Date.now()) / 1000);
    if(left > 0){ toast(pick('lockWait').replace(/%n/g, left)); return; }
    if(pinCheck(inp.value)){
      unlocked = true; pinFailSet(0); pinWaitSet(0); inp.value = ''; renderMaster(); return;
    }
    inp.value = '';
    const f = pinFailGet() + 1;
    if(f >= 5){ pinFailSet(0); pinWaitSet(Date.now() + 30000); toast(pick('lockWait').replace(/%n/g, 30)); }
    else { pinFailSet(f); toast(pick('lockWrong')); }
    inp.focus();
  };
  document.getElementById('pinGo').onclick = submit;
  document.getElementById('pinCancel').onclick = () => go('count');
  inp.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); submit(); } };
  setTimeout(() => { try{ inp.focus(); }catch(e){} }, 60);
}

const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dayGap = (a, b) => Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000);

  if(!sup || !sup.cutoff) return false;

}

/* ---------- 計算 ---------- */
const num = v => {
  if(v === null || v === undefined) return null;
  const t = String(v).replace(/[\s\u3000]/g, '');   /* 全角スペースも空欄として扱う */
  if(t === '') return null;
  const n = Number(t);
  return isNaN(n) ? null : n;
};
const round2 = n => Math.round(n*100)/100;
/* ---------- ロット（入数）まわり ----------
   数える単位も、基準在庫も、発注も、すべてロット（袋・箱…）の個数でそろえる。
     par   … 基準在庫。ロット数（例：米 2 ＝ 2袋）
     counts… 棚を数えた在庫。ロット数（開けかけは 0.5 のように小数でよい）
     lot   … 1ロットの量（入数）。単位は品目の unit（例：1袋＝1000g なら 1000）
     price … 1ロットの価格（1単位あたりではない）
   実量（g など）は「2袋＝2,000g」の表示と、シート・使用履歴に残すときだけ使う。 */
const lotSize = it => { const v = Number(it.lot); return v > 0 ? v : 1; };
/* ロット数 → 実量（g など） */
const toUnits = (it, lots) => round2(Number(lots || 0) * lotSize(it));
/* 発注ロット数。未カウントなら null、足りていれば 0 */
function orderLots(item){
  const c = num(state.counts[item.id]);
  if(c === null) return null;
  const short = round2(Number(item.par) - c);
  if(short <= 0) return 0;
  return Math.ceil(short - 1e-9);          /* 半端は1ロットに切り上げ */
}
/* 発注量を実量（g など）で。シートに残すときだけ使う */
function orderQty(item){
  const n = orderLots(item);
  return n === null ? null : toUnits(item, n);
}
/* 概算金額＝ロット数 × 1ロットの価格 */
const lotsAmount = (item, lots) => round2(Number(lots || 0) * Number(item.price || 0));
const orderAmount = item => lotsAmount(item, orderLots(item) || 0);
/* ロットの呼び名。未設定なら「ล็อต / ロット」 */
function lotName(it){
  const u = LOT_UNITS.find(x => x.k === (it && it.lotUnit));
  const th = u ? u.th : L.lotGeneric[0];
  const ja = u ? u.ja : L.lotGeneric[1];
  return state.lang === 'ja' ? ja : (state.lang === 'th' ? th : th + '/' + ja);
}
/* シートに残す呼び名。表示言語によって列の中身が変わらないよう日本語で固定する */
const lotNameJa = it => {
  const u = LOT_UNITS.find(x => x.k === (it && it.lotUnit));
  return u ? u.ja : L.lotGeneric[1];
};
/* 「2 ถุง/袋」と、その内訳「2,000 g」。1ロット＝1単位のときは内訳を出さない */
function lotsText(it, lots){
  const total = toUnits(it, lots);
  /* 1ロット＝1単位（個・枚など）のときは実量を出さない（同じ数字になるため） */
  return {head: fmt(lots) + ' ' + lotName(it),
          sub: lotSize(it) === 1 ? '' : fmt(total) + ' ' + esc(it.unit)};
}
/* 1行で「2 袋（2,000 g）」。1ロット＝1単位なら「2 袋」だけ */
function lotsLabel(it, lots){
  const t = lotsText(it, lots);
  return lotSize(it) === 1 ? t.head : `${t.head}（${t.sub}）`;
}
/* 品目マスタの基準在庫欄に添える「＝ 2,000 g」 */
const parEqText = it => lotSize(it) === 1 ? '' : `＝ ${fmt(toUnits(it, it.par))} ${esc(it.unit)}`;
const money = n => state.currency + Math.round(n).toLocaleString('en-US');
const fmt = n => Number(n).toLocaleString('en-US', {maximumFractionDigits:2});
const visibleItems = () => state.supFilter ? state.items.filter(i => i.supId === state.supFilter) : state.items;
/* 入荷数：納品実数が入力されていればそれを使い、未入力なら発注数で代用する */
const receivedOf = p => {
  if(!p) return 0;
  const r = num(p.received);
  return r === null ? Number(p.order || 0) : r;
};
function usedQty(item){
  const p = state.prev[item.id];
  const c = num(state.counts[item.id]);
  if(!p || c === null) return null;
  const u = round2(Number(p.stock) + receivedOf(p) - c);
  return u < 0 ? 0 : u;
}
function summary(){

  for(const it of visibleItems()){
    const lots = orderLots(it);
    if(lots === null){ blank++; continue; }
    if(lots > 0){ need++; amount += orderAmount(it); }
  }
  const list = visibleItems();
  return {need, amount, blank, counted:list.length - blank, total:list.length};

function addHolidayYear(y){
  const src = TH_HOLIDAYS[y] || [];
  if(!Array.isArray(state.hol)) state.hol = [];
  const have = new Set(state.hol.map(h => h.d + '|' + h.th));
  let n = 0;
  for(const [d, th, ja] of src){
    if(have.has(d + '|' + th)) continue;
    state.hol.push({d, th, ja}); n++;
  }
  state.hol.sort((a, b) => a.d < b.d ? -1 : 1);
  return n;
}
/* 「タイ語の文／日本語の文」の形にそろえる。pick() をそのまま使うと
   「タイ語見出し／日本語見出し：タイ語の名前／日本語の名前」と入れ子になって読みにくいため。 */
function holLine(key, names, dateYmd){
  const stamp = i => {
    if(!dateYmd) return '';
    const d = new Date(dateYmd + 'T00:00:00');
    const w = i === 1 ? WD_JA[d.getDay()] : WD_TH[d.getDay()];
    return `${d.getDate()}/${d.getMonth() + 1}(${w}) `;
  };
  const line = i => L[key][i] + stamp(i) + names.map(h => (i === 1 ? (h.ja || h.th) : h.th)).join(' / ');
  if(state.lang === 'ja') return line(1);
  if(state.lang === 'th') return line(0);
  return line(0) + '　／　' + line(1);
}
function renderHolBar(){
  const el = document.getElementById('holbar');
  if(!el) return;
  const list = Array.isArray(state.hol) ? state.hol : [];
  const t = new Date();
  const today = ymd(t);
  const todays = list.filter(h => h.d === today);
  if(todays.length){
    el.hidden = false;
    el.textContent = holLine('holToday', todays, '');
    return;
  }
  const lim = ymd(new Date(t.getFullYear(), t.getMonth(), t.getDate() + 7));
  const soon = list.filter(h => h.d > today && h.d <= lim).sort((a, b) => a.d < b.d ? -1 : 1)[0];
  if(soon){
    el.hidden = false;
    el.textContent = holLine('holSoon', [soon], soon.d);
    return;
  }
  el.hidden = true;
}

/* ---------- シートから使用履歴を読み戻す ----------
   自動提案のもとになる使用履歴は端末のブラウザにしか無いため、機種変更や初期化で失われる。
   シートには毎回の記録が残っているので、そこから履歴を組み立て直して端末に戻す。
   Apps Script への GET は素の fetch だと CORS で読めないことがあるため、JSONP（script タグ）で読む。 */
function jsonp(url, params, ms){
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Math.random().toString(36).slice(2, 10);
    const sc = document.createElement('script');
    let done = false;
    const cleanup = () => { try{ delete window[cb]; }catch(e){ window[cb] = undefined; } sc.remove(); };
    const timer = setTimeout(() => { if(!done){ done = true; cleanup(); reject(new Error('timeout')); } }, ms || 25000);
    window[cb] = data => { done = true; clearTimeout(timer); cleanup(); resolve(data); };
    sc.onerror = () => { if(!done){ done = true; clearTimeout(timer); cleanup(); reject(new Error('network')); } };
    const q = new URLSearchParams(Object.assign({}, params, {callback: cb})).toString();
    sc.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + q;
    document.head.appendChild(sc);
  });
}
async function restoreHistory(btn){
  if(!state.sheetUrl){ toast(pick('restNoUrl')); return; }
  if(!confirm(pick('restConfirm'))) return;
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = pick('restLoading');
  try{
    const r = await jsonp(state.sheetUrl, {mode:'history', store: state.store || '', days: 28});
    if(!r || !r.ok) throw new Error((r && r.error) || 'ng');
    const rows = Array.isArray(r.rows) ? r.rows : [];
    const prevs = Array.isArray(r.prev) ? r.prev : [];
    if(!rows.length && !prevs.length){ toast(pick('restEmpty')); return; }
    const ids = new Set(state.items.map(i => i.id));
    state.history = rows.filter(h => ids.has(h.id))
      .map(h => ({id:h.id, d:h.d, used:Number(h.used) || 0, days:Number(h.days) || 0}));
    const lim = new Date(); lim.setDate(lim.getDate() - 14);
    const recent = ymd(lim);
    prevs.forEach(p => {
      const it = state.items.find(x => x.id === p.id);
      if(!it) return;
      /* 何ヶ月も前の発注が納品待ちに溜まらないよう、直近14日の記録だけ戻す */
      if(!p.date || p.date < recent) return;
      /* シートは実量（g など）で入っているので、入数で割ってロット数に戻す */
      const n = lotSize(it);
      const cur = state.prev[p.id];
      state.prev[p.id] = {stock: round2((Number(p.stock) || 0) / n), order: round2((Number(p.order) || 0) / n),
                          date: p.date,
                          received: (cur && cur.date === p.date) ? cur.received : null};
    });
    save(); flushSave();
    toast(pick('restOk').replace(/%n/g, state.history.length));
    renderMaster();
  }catch(e){
    toast(pick('restErr'));
  }finally{
    btn.disabled = false; btn.textContent = label;
  }
}

/* ============ マスタの共有（端末間の同期） ============
   品目・仕入先・単位・祝日をシートに1本だけ置き、全端末が同じものを使う。
   品目マスタの中身（区分・単位・基準在庫・1ロットの量・ロットの呼び名・1ロットの価格・仕入先）も
   まとめて同じものになる。
   ・取り込みは自動（起動時と、他のアプリから戻ったとき）
   ・配るのは手動（設定画面の「全端末に配る」）
   店舗名・Apps ScriptのURL・暗証番号・在庫の入力内容・使用履歴は端末ごとのまま。 */
const masterData = () => ({ver:DATA_VER, items:state.items, suppliers:state.suppliers, units:state.units, hol:state.hol});
/* 他の端末から来たデータは欠けている項目があるので、使う前に形を整える */
function normSup(s){
  const o = {...s};
  if(!Array.isArray(o.closed)) o.closed = [];
  if(!Array.isArray(o.holidays)) o.holidays = [];
  return o;
}
function normItem(it){
  const o = {...it};
  o.par = Math.max(0, Number(o.par) || 0);
  o.lot = Number(o.lot) > 0 ? Number(o.lot) : 1;
  o.price = Math.max(0, Number(o.price) || 0);
  if(!o.unit) o.unit = (state.units || ['g'])[0];
  return o;
}
/* 変更されたかどうかは、丸ごと持たずに短い符号で比べる（端末の保存領域を使わないため） */
function masterSig(){
  const t = JSON.stringify(masterData());
  let h = 5381;
  for(let i=0;i<t.length;i++) h = ((h*33) ^ t.charCodeAt(i)) >>> 0;
  return `${t.length}-${h.toString(36)}`;
}
const masterDirty = () => !!state.masterSig && masterSig() !== state.masterSig;
function applyMaster(d){
  if(!d) return false;
  /* 古い版（基準在庫を実量で持っていた版）が配ったマスタは受け取らない。
     ロット数と実量を見分けられず、黙って基準在庫を壊すおそれがあるため。 */
  if(Array.isArray(d.items) && d.items.length && !(Number(d.ver) >= 2)){
    toast(pick('mstOldVer'));
    return false;
  }
  if(Array.isArray(d.items) && d.items.length) state.items = d.items.map(normItem);
  if(Array.isArray(d.suppliers)) state.suppliers = d.suppliers.map(normSup);
  if(Array.isArray(d.units) && d.units.length) state.units = d.units;
  if(Array.isArray(d.hol)) state.hol = d.hol;
  /* 配られたマスタから消えた品目は、在庫入力と前回在庫も残さない */
  const ids = new Set(state.items.map(i => i.id));
  for(const k of Object.keys(state.counts)) if(!ids.has(k)) delete state.counts[k];
  for(const k of Object.keys(state.prev)) if(!ids.has(k)) delete state.prev[k];
  if(state.supFilter && !state.suppliers.some(x => x.id === state.supFilter)) state.supFilter = null;
  return true;
}
let mstBusy = false;
/* opts.manual … 設定画面のボタンから呼ばれた（メッセージを必ず出す） */
async function pullMaster(opts){
  const o = opts || {};
  if(mstBusy) return false;
  if(!state.sheetUrl){ if(o.manual) toast(pick('sheetNoUrl')); return false; }
  mstBusy = true;
  try{
    const meta = await jsonp(state.sheetUrl, {mode:'masterrev'}, 20000);
    if(!meta || !meta.ok) throw new Error('ng');
    const rev = Number(meta.rev) || 0;
    if(!rev){ if(o.manual) toast(pick('mstNone')); return false; }
    if(rev === Number(state.masterRev || 0)){ if(o.manual) toast(pick('mstUpToDate')); return false; }
    /* 数えている途中に画面を作り直すと入力が飛ぶので、入力があるときは見送る */
    if(!o.manual && view === 'count' && Object.keys(state.counts).some(k => state.counts[k] !== '')){
      toast(pick('mstHold'));
      return false;
    }
    /* 自動のときは、この端末の未配信の変更を黙って消さない */
    if(!o.manual && masterDirty() && !confirm(pick('mstOverwrite'))) return false;
    const full = await jsonp(state.sheetUrl, {mode:'master'}, 25000);
    if(!full || !full.ok || !full.data) throw new Error('ng');
    applyMaster(full.data);
    state.masterRev = Number(full.rev) || rev;
    state.masterAt = full.updatedAt || '';
    state.masterBy = full.by || '';
    state.masterSig = masterSig();
    save(); flushSave();
    toast(pick('mstPulled').replace(/%n/g, state.masterRev));
    go(view);
    return true;
  }catch(e){
    if(o.manual) toast(pick('mstErr'));
    return false;
  }finally{
    mstBusy = false;
  }
}
/* 配る。POSTは応答を読めないので、送ったあとに版が上がったかを見に行って確かめる。 */
async function pushMaster(btn){
  if(!state.sheetUrl){ toast(pick('sheetNoUrl')); return; }
  let meta = null;
  try{ meta = await jsonp(state.sheetUrl, {mode:'masterrev'}, 20000); }catch(e){}
  const srvRev = (meta && meta.ok) ? (Number(meta.rev) || 0) : 0;
  if(srvRev && srvRev !== Number(state.masterRev || 0)){
    const who = `${(meta && meta.updatedAt) || ''} ${(meta && meta.by) || ''}`.trim();
    if(!confirm(pick('mstNewer').replace('%s', who))) return;
  }
  if(!confirm(pick('mstPushConfirm'))) return;
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = pick('mstSending');
  try{
    await postRows(JSON.stringify({type:'master', by: state.store || '', data: masterData()}));
    let done = false;
    for(let i=0;i<8;i++){
      await new Promise(r => setTimeout(r, 1500));
      try{
        const m = await jsonp(state.sheetUrl, {mode:'masterrev'}, 15000);
        if(m && m.ok && (Number(m.rev) || 0) > srvRev){
          state.masterRev = Number(m.rev);
          state.masterAt = m.updatedAt || '';
          state.masterBy = m.by || '';
          state.masterSig = masterSig();
          save(); flushSave();
          done = true; break;
        }
      }catch(e){}
    }
    toast(pick(done ? 'mstPushed' : 'mstPushNg'));
  }finally{
    btn.disabled = false; btn.textContent = label;
    renderMaster();
  }
}

/* ============ 基準在庫・発注ロットの自動提案 ============ */
const leadOf = it => { const sp = supOf(it); const v = sp ? Number(sp.lead) : NaN; return v > 0 ? v : 1; };
function usageStats(itemId, windowDays){
  const lim = new Date(); lim.setDate(lim.getDate() - (windowDays || 28));
  const from = ymd(lim);
  const rows = state.history.filter(h => h.id === itemId && h.d >= from);
  if(!rows.length) return null;
  const used = rows.reduce((a, h) => a + Number(h.used || 0), 0);
  const days = rows.reduce((a, h) => a + Number(h.days || 0), 0);
  if(!(days > 0)) return null;
  return {perDay: used / days, n: rows.length};
}
/* ロット数は現場が数えやすい刻みに切り上げる（5未満は0.5刻み、それ以上は1刻み） */
const niceLots = n => {
  if(!(n > 0)) return 0;
  return n < 5 ? Math.ceil(n * 2 - 1e-9) / 2 : Math.ceil(n - 1e-9);
};
function suggestFor(it){
  const st = usageStats(it.id, 28);
  if(!st || !(st.perDay > 0)) return null;
  const cycle = Number(state.cycle) > 0 ? Number(state.cycle) : 3;
  const safety = 1 + (Number(state.safety) || 0) / 100;
  /* 1ロットの量は仕入先の売り方で決まるので提案しない。基準在庫だけを出す。
     使用履歴は実量（g など）なので、入数で割ってロット数にしてから提案する。 */
  const need = st.perDay * (leadOf(it) + cycle) * safety;
  return {perDay: st.perDay, n: st.n, par: niceLots(need / lotSize(it))};
}
function renderSuggest(){
  const box = document.getElementById('sugBox');
  if(!box) return;
  const rows = state.items.map(it => ({it, sg: suggestFor(it)})).filter(r => r.sg && r.sg.par > 0);
  if(!rows.length){ box.innerHTML = `<div class="warn">${pick('sugNoHist')}</div>`; return; }
  let h = '<div class="sug">';
  for(const r of rows){
    const changed = Number(r.it.par) !== r.sg.par;
    h += `<label class="sugrow">
      <input type="checkbox" data-sug="${r.it.id}" ${changed ? 'checked' : ''}>
      <span class="n">${nm(r.it)}<span class="d num">${fmt(round2(r.sg.perDay))} ${esc(r.it.unit)}${L.sugPerDay[state.lang==='ja'?1:0]}・${r.sg.n}${L.sugTimes[state.lang==='ja'?1:0]}</span></span>
      <span class="v">${L.sugPar[state.lang==='ja'?1:0]}<span class="old">${fmt(r.it.par)}</span><b>${lotsLabel(r.it, r.sg.par)}</b></span>
    </label>`;
  }
  box.innerHTML = h + `</div><button class="addbtn" id="sugApply">${one('sugApply')}</button>`;
  document.getElementById('sugApply').onclick = () => {
    let n = 0;
    box.querySelectorAll('[data-sug]:checked').forEach(cb => {
      const it = state.items.find(x => x.id === cb.dataset.sug);
      const sg = it ? suggestFor(it) : null;
      if(!sg || !(sg.par > 0)) return;
      it.par = sg.par;
      n++;
    });
    save(); renderMaster(); toast(pick('sugApplied').replace(/%n/g, n));
  };
}

/* ---------- シート送信 ---------- */
function sheetBox(){
  const hasSheet = !!state.sheetUrl;
  const ob = (state.outbox || []).length;
  return `<div class="sheetbox">
    <h4>${two('recTitle')}</h4>
    <p>${pick(hasSheet ? 'recDescSheet' : 'recDescLocal')}${state.lastSent ? `<br>${L.lastSent[state.lang==='ja'?1:0]}${esc(state.lastSent)}` : ''}</p>
    ${hasSheet ? '' : `<p class="cap2">${pick('recHintSheet')}</p>`}
    ${state.supFilter ? `<div class="warn">${pick('recAllSup')}</div>` : ''}
    ${ob ? `<div class="warn">${pick('outboxN').replace(/%n/g, ob)}</div>
      <div class="brow"><button type="button" class="alt" id="obSend">${pick('outboxSend')}</button>
      <button type="button" class="alt" id="obDrop">${pick('outboxDrop')}</button></div>` : ''}
    <div class="brow">
      <button type="button" id="sheetSend" ${alreadyRecorded() ? 'disabled' : ''}>${pick(alreadyRecorded() ? 'recDone' : 'recTitle')}</button>
      <button type="button" class="alt" id="sheetCsv">${pick('sheetCsv')}</button>
    </div></div>`;
}
function buildRows(){
  const d = new Date();
  return state.items.filter(it => num(state.counts[it.id]) !== null).map(it => {
    const s = supOf(it);
    const lots = orderLots(it) || 0;
    const q = toUnits(it, lots);
    const u = usedQty(it);
    const p = state.prev[it.id];
    /* シートの「単価」列は1単位あたりに直して入れる（発注数×単価＝金額 が成り立つように）。
       ロット数・入数・ロット単価は末尾の列に別で残す。 */
    const unitPrice = round2(Number(it.price || 0) / lotSize(it));
    /* アプリはロット数で持っているが、シートには従来どおり実量（g など）で残す。
       入数を変えても過去の使用量と比べられるようにするため。 */
    return {
      date: ymd(d), time: `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,
      store: state.store,
      supplierId: s ? s.id : '', supplier: s ? s.name : '', supplierJa: s ? (s.nameJa||'') : '',
      itemId: it.id, item: it.name, itemJa: it.nameJa || '', unit: it.unit, category: it.cat || '',
      prevStock: p ? toUnits(it, p.stock) : '', received: p ? toUnits(it, receivedOf(p)) : '',
      stock: toUnits(it, num(state.counts[it.id])), used: u === null ? '' : toUnits(it, u),
      par: toUnits(it, it.par), order: q, price: unitPrice, amount: lotsAmount(it, lots), currency: state.currency,
      lots, lotSize: lotSize(it), lotPrice: Number(it.price || 0), lotUnit: lotNameJa(it)
    };
  });
}
/* ---------- LINEに送る本文 ----------
   発注リスト画面と同じ組み方で、仕入先ごとの品目・数量・金額・小計、最後に合計を並べる。
   画面の絞り込み（チップ）に関わらず、全品目を対象にする。
   表示言語の設定に関わらず、タイ語と日本語を併記する。 */
const lineNm = o => (o && o.nameJa) ? `${o.name} / ${o.nameJa}` : ((o && o.name) || '-');
/* 発注できない理由はタイ語・日本語の両方を出したいので、一時的に言語を切り替えて2回読む */
function bothReason(sup){
  const cur = state.lang;
  try{
    state.lang = 'th'; const th = closedReason(sup);
    state.lang = 'ja'; const ja = closedReason(sup);
    return (th && ja) ? `${th} / ${ja}` : (th || ja);
  }finally{
    state.lang = cur;                       /* 途中で失敗しても表示言語を戻す */
  }
}
function buildLineText(){
  const rows = state.items.map(it => ({it, lots:orderLots(it)})).filter(r => r.lots > 0);
  if(!rows.length) return '';
  const groups = [...new Set(rows.map(r => r.it.supId || ''))].map(id => {
    const sup = state.suppliers.find(x => x.id === id) || null;
    const list = rows.filter(r => (r.it.supId||'') === id);
    return {sup, list, ok: sup ? canOrderToday(sup) : true,
            sum:list.reduce((a,r) => a + lotsAmount(r.it, r.lots), 0)};
  });
  groups.sort((a,b) => b.ok - a.ok);

  const out = [
    `${L.lineTitle[0]} / ${L.lineTitle[1]}`,
    `${L.lineStore[0]} / ${L.lineStore[1]}：${state.store || '-'}`,
    dateStr()
  ];
  const anyToday = groups.some(g => g.ok);
  let today = 0, later = 0, shownLater = false;
  groups.forEach((g, gi) => {
    if(g.ok) today += g.sum; else later += g.sum;
    if(anyToday && gi === 0) out.push('', `― ${L.orderToday[0]} / ${L.orderToday[1]} ―`);
    if(!g.ok && !shownLater){ shownLater = true; out.push('', `― ${L.orderLater[0]} / ${L.orderLater[1]} ―`); }
    out.push('', `■ ${g.sup ? lineNm(g.sup) : `${L.noSupplier[0]} / ${L.noSupplier[1]}`}`);
    if(!g.ok) out.push(`　（${bothReason(g.sup)} → ${L.nextOrderDay[0].trim()} / ${L.nextOrderDay[1].trim()} ${dateLabel(nextOrderDate(g.sup))}）`);
    for(const r of g.list){
      const total = round2(r.lots * lotSize(r.it));
      const amt = lotsAmount(r.it, r.lots);
      out.push(lotSize(r.it) === 1
        ? `・${lineNm(r.it)}　${fmt(r.lots)} ${lotName(r.it)}　${money(amt)}`
        : `・${lineNm(r.it)}　${fmt(r.lots)} ${lotName(r.it)}（${fmt(total)} ${r.it.unit}）　${money(amt)}`);
    }
    out.push(`　${L.subtotal[0]} / ${L.subtotal[1]}　${money(g.sum)}`);
  });
  out.push('', `${L.lineTotal[0]} / ${L.lineTotal[1]}　${money(today)}`);
  if(later) out.push(`${L.laterTotal[0]} / ${L.laterTotal[1]}　${money(later)}`);
  out.push('', L.priceNote[0], L.priceNote[1]);
  return out.join('\n');
}
/* 設定画面から、LINEに1通だけテストを送って結果を確かめる。
   応答を読みたいので、書き込み（POST）ではなく履歴の復元と同じ JSONP で呼ぶ。 */
async function lineTest(btn){
  if(!state.sheetUrl){ toast(pick('lineNoUrl')); return; }
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = pick('lineTesting');
  try{
    const r = await jsonp(state.sheetUrl, {mode:'linetest'}, 25000);
    if(r && r.ok) toast(pick('lineTestOk'));
    else toast(pick('lineTestNg') + String((r && r.error) || '').slice(0, 90));
  }catch(e){
    toast(pick('lineTestNg'));
  }finally{
    btn.disabled = false; btn.textContent = label;
  }
}
function snapshot(){
  const d = new Date();
  const today = ymd(d);
  for(const it of state.items){
    const c = num(state.counts[it.id]);
    if(c === null) continue;
    const p = state.prev[it.id];
    const u = usedQty(it);
    if(p && p.date && u !== null){
      const days = dayGap(p.date, today);
      /* 使用履歴は実量（g など）で残す。入数を変えても数字がぶれないように */
      if(days > 0 && days <= 90) state.history.push({id:it.id, d:today, used:toUnits(it, u), days});
    }
    /* 前回在庫・前回発注はロット数で持つ（納品画面もロットで数えるため）。
       同じ日に記録をやり直したときは、入力済みの納品実数を消さない。 */
    const keep = (p && p.date === today) ? p.received : null;
    state.prev[it.id] = {stock:c, order:orderLots(it) || 0, date:today, received:keep};
  }
  /* 記録したら、次にアプリを開いたときに在庫の入力を空に戻す。
     前日の数字が残ったまま記録されて、偽の使用量が入るのを防ぐため。
     その場で消さないのは、発注リストのコピーをそのあと使うため。 */
  state.clearNext = true;
  if(state.history.length > 3000) state.history = state.history.slice(-3000);
  state.lastSent = `${ymd(d)} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  save();
}
/* Apps Script は POST に別ドメインへのリダイレクトを返すため、通常の fetch では応答を読めず
   「失敗した」と誤判定してしまう。実際にはシートへの書き込みは成功しているので、
   そこで再送すると行が二重に入る。no-cors で一度だけ送り、応答は読まずに扱う。
   万一届かなかった場合は未送信キューに残し、あとから同じ payload（同じ batchId）で送り直す。 */
const newBatchId = () => `${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;
const SEND_TIMEOUT = 20000;
/* 同じ内容をもう一度押しても二重に記録しないよう、記録した時点の入力内容を覚えておく */
const countsSig = () => ymd(new Date()) + '|' + JSON.stringify(state.counts);
const alreadyRecorded = () => !!state.recordedSig && state.recordedSig === countsSig();
let sending = false;
async function postRows(payload){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), SEND_TIMEOUT);
  try{
    await fetch(state.sheetUrl, {
      method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:payload, signal:ctl.signal
    });
    return true;
  }catch(e){
    return false;
  }finally{
    clearTimeout(timer);
  }
}
function bindSheet(){
  const sendBtn = document.getElementById('sheetSend');
  const csvBtn = document.getElementById('sheetCsv');
  const obSend = document.getElementById('obSend');
  const obDrop = document.getElementById('obDrop');
  if(csvBtn) csvBtn.onclick = () => {
    const rows = buildRows();
    if(!rows.length) return;
    const head = Object.keys(rows[0]);
    copy([head.join(','), ...rows.map(r => head.map(h => String(r[h] ?? '')).join(','))].join('\n'));
  };
  if(obSend) obSend.onclick = async () => {
    if(!state.sheetUrl){ toast(pick('sheetNoUrl')); return; }
    obSend.disabled = true; obSend.textContent = pick('recSaving');
    try{
      const keep = [];
      for(const payload of (state.outbox || [])) if(!(await postRows(payload))) keep.push(payload);
      state.outbox = keep; save();
      toast(pick(keep.length ? 'outboxFail' : 'outboxOk'));
    }finally{
      obSend.disabled = false; obSend.textContent = pick('outboxSend');
      go(view);
    }
  };
  if(obDrop) obDrop.onclick = () => {
    if(!confirm(pick('confirmDrop'))) return;
    state.outbox = []; save(); go(view);
  };
  /* 発注の確定。シートが未設定でも端末には必ず記録する（納品画面と自動提案がこれを使う） */
  if(sendBtn) sendBtn.onclick = async () => {
    if(sending || alreadyRecorded()) return;
    const rows = buildRows();
    if(!rows.length) return;
    sending = true;
    sendBtn.disabled = true; sendBtn.textContent = pick('recSaving');
    let msg = 'recOkLocal';
    try{
      if(state.sheetUrl){
        /* LINE通知が有効なら本文も一緒に送る。発注が0件のときは本文が空になり、LINEには飛ばない。
           未送信キューに積んだ場合も同じ payload を送り直すので、あとからLINEに届く。
           同じ batchId は Apps Script 側で弾かれるため、再送しても二重には飛ばない。 */
        const lineText = state.lineOn === false ? '' : buildLineText();
        const payload = JSON.stringify({store:state.store, batchId:newBatchId(), rows, lineText});
        if(await postRows(payload)) msg = lineText ? 'recOkLine' : 'recOkSheet';
        else { state.outbox = [...(state.outbox || []), payload].slice(-20); msg = 'recOkOffline'; }
      }
      state.recordedSig = countsSig();
      snapshot();
      toast(pick(msg));
    }finally{
      sending = false;
      go(view);
    }
  };
}

    const id = 'i' + Date.now().toString(36);
    const sid = state.supFilter || (state.suppliers[0]||{}).id || '';
    const sup = state.suppliers.find(x => x.id === sid);
    state.items.push({id, cat: sup ? sup.name : '', name:'รายการใหม่', nameJa:'新しい品目', unit:(state.units||['g'])[0], par:1, lot:1, lotUnit:'', price:0, supId: sid});
    save(); renderMaster();
    const cards = app.querySelectorAll('.mcard');
    const el = cards[cards.length-1];
    el.open = true; el.scrollIntoView({block:'center'}); el.querySelector('input').select();
  };
  document.getElementById('resetAll').onclick = () => {
    if(!confirm(pick('confirmReset'))) return;
    state.counts = {}; state.recordedSig = ''; save(); toast(pick('resetDone'));
  };
  document.getElementById('clearHist').onclick = () => {
    if(!confirm(pick('confirmHist'))) return;
    state.history = []; save(); renderMaster(); toast(pick('histCleared'));
  };
}
function reopenMaster(supId, focus){
  renderMaster();
  const el = [...app.querySelectorAll('.mcard')].find(c => c.querySelector(`[data-id="${supId}"]`));
  if(el){ el.open = true; el.scrollIntoView({block:'center'}); if(focus) el.querySelector('input').select(); }
}

/* ---------- 自動更新チェック ----------
   GitHub Pages はHTMLを10分キャッシュするため、更新してもスマホに古い版が残ることがある。
   サーバー側の Last-Modified と、いま動いている文書の document.lastModified を比べ、
   新しければクエリを付けて読み込み直す（＝キャッシュを迂回する）。版番号を手で振る必要はない。 */
const UPD_KEY = 'stock-order-app-updated-to';
let updCheckedAt = 0;
const buildStamp = () => {
  const d = new Date(document.lastModified);
  if(isNaN(d.getTime())) return '—';
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
};
function applyUpdate(stamp){
  flushSave();
  try{ sessionStorage.setItem(UPD_KEY, String(stamp)); }catch(e){}
  location.replace(location.pathname + '?v=' + stamp);
}
function showUpdBar(stamp){
  const el = document.getElementById('updbar');
  if(!el) return;
  el.innerHTML = `<span class="t">${pick('updNew')}</span>
    <button type="button" id="updGo">${pick('updBtn')}</button>
    <button type="button" class="x" id="updX" aria-label="${pick('updClose')}">✕</button>`;
  el.hidden = false;
  window.scrollTo(0, 0);
  document.getElementById('updGo').onclick = () => applyUpdate(stamp);
  document.getElementById('updX').onclick = () => { el.hidden = true; };
}
async function checkForUpdate(manual){
  const now = Date.now();
  if(!manual && now - updCheckedAt < 60000) return 'skip';
  updCheckedAt = now;
  let lm = null;
  try{
    const res = await fetch(location.pathname + '?t=' + now, {method:'HEAD', cache:'no-store'});
    if(res.ok) lm = res.headers.get('last-modified');
  }catch(e){ return 'offline'; }
  if(!lm) return 'unknown';
  const server = new Date(lm).getTime();
  const mine = new Date(document.lastModified).getTime();
  if(isNaN(server) || isNaN(mine) || server - mine <= 2000) return 'latest';
  if(manual){ applyUpdate(server); return 'updating'; }
  let tried = null;
  try{ tried = sessionStorage.getItem(UPD_KEY); }catch(e){}
  if(tried === String(server)){ showUpdBar(server); return 'bar'; }   /* 一度やり直しても古いまま → 自動では繰り返さない */
  applyUpdate(server);
  return 'updating';
}

/* ---------- 共通 ---------- */
const app = document.getElementById('app');
const bar = document.getElementById('bar');
const storeTitle = document.getElementById('storeTitle');
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function dateStr(){ const d = new Date(); return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()} (${wd(d.getDay())})`; }
function applyLang(){ document.body.className = state.lang === 'both' ? '' : 'lang-' + state.lang; }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2200);
}
function copy(text){
  const done = () => toast(pick('copied'));
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(done).catch(fallback); }
  else fallback();
  function fallback(){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast(pick('copyFail')); }
    ta.remove();
  }
}
function go(v){
  if(view === 'master' && v !== 'master') unlocked = false;   /* 設定画面から離れたら再びロックする */
  view = v;
  document.querySelectorAll('[data-nav]').forEach(b => b.setAttribute('aria-current', String(b.dataset.nav === v)));
  window.scrollTo(0,0);
  renderHolBar();
  if(v === 'count') renderCount();
  else if(v === 'recv') renderRecv();
  else if(v === 'result') renderResult();
  else if(lockOn() && !unlocked) renderLock();
  else renderMaster();
}
app.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.recv){
    const p = state.prev[t.dataset.recv];
    if(p){
      const v = num(t.value);
      p.received = v === null ? null : Math.max(0, v);      /* マイナスは0扱い */
      save(); updateRecvRow(t);
    }
    return;
  }
  if(!t.dataset.count) return;
  const c = num(t.value);
  state.counts[t.dataset.count] = c === null ? '' : String(Math.max(0, c));
  save(); updateRow(t);
});
app.addEventListener('click', e => {
  const rb = e.target.closest('[data-rstep]');
  if(rb){
    const input = app.querySelector(`[data-recv="${rb.dataset.rid}"]`);
    const p = state.prev[rb.dataset.rid];
    if(!input || !p) return;
    const cur = num(input.value);
    const next = Math.max(0, round2((cur === null ? Number(p.order || 0) : cur) + Number(rb.dataset.rstep)));
    input.value = next; p.received = next;
    save(); updateRecvRow(input);
    return;
  }
  const b = e.target.closest('[data-step]');
  if(!b) return;
  const input = app.querySelector(`[data-count="${b.dataset.id}"]`);
  const next = Math.max(0, round2((num(input.value) ?? 0) + Number(b.dataset.step)));
  input.value = next; state.counts[b.dataset.id] = String(next);
  save(); updateRow(input);
});
function updateRow(input){
  const it = state.items.find(x => x.id === input.dataset.count);
  const lots = orderLots(it);
  const flag = input.closest('.row').querySelector('.flag');
  if(lots === null){ flag.className='flag blank'; flag.textContent = pick('notFilled'); }
  else if(lots > 0){
    flag.className='flag need';
    flag.textContent = `${L.orderN[state.lang==='ja'?1:0]}${lotsLabel(it, lots)}`;
  }
  else { flag.className='flag ok'; flag.textContent = pick('enough'); }
  const s = summary();
  const sum = bar.querySelector('.sum');
  if(sum) sum.innerHTML = `<b class="num">${s.counted} / ${s.total}${L.filled[state.lang==='ja'?1:0]}</b>${s.need}${L.shortN[state.lang==='ja'?1:0]}${money(s.amount)}`;
  const g = document.getElementById('toResult');
  if(g) g.disabled = !s.counted;
}
document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => go(b.dataset.nav));
(async function init(){
  await load();
  applyLang();
  document.getElementById('today').textContent = dateStr();
  storeTitle.textContent = state.store || 'นับสต๊อก';
  go('count');
  renderHolBar();
  if(clearedOnBoot) toast(pick('recCleared'));
  checkForUpdate();
  /* 起動のたびに共有マスタを見に行く。版が上がっていれば取り込む */
  pullMaster({});
})();
</script>
